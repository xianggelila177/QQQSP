name: qqqsp
services:
  panel:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8567"
    ports:
      - "127.0.0.1:${PORT:-8567}:8567"
    volumes:
      - qqqsp-state:/app/state
      - qqqsp-logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 20s
volumes:
  qqqsp-state:
  qqqsp-logs:
