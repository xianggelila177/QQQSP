<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'self'"><title>接口密钥管理 · QQQSP</title><link rel="stylesheet" href="api-keys.css"><script src="api-keys.js" defer></script></head>
<body><main><nav><a href="/">返回行情面板</a> · <a href="/market-api-guide.md">接口使用说明</a></nav><h1>接口密钥管理</h1><p>管理操作需要独立管理员密钥。密钥仅在当前页面内存中使用，不写入浏览器存储；请通过 HTTPS 或本机回环地址访问。</p>
<form id="unlock"><label for="admin">管理员密钥</label><input id="admin" type="password" autocomplete="off" required><button>解锁并读取</button><button id="lock" type="button">锁定并清空</button></form>
<p id="status" role="status" aria-live="polite">尚未解锁</p>
<section id="controls" hidden><h2>创建只读密钥</h2><form id="create"><label for="label">名称</label><input id="label" maxlength="80" required placeholder="例如：本地研究助手"><fieldset><legend>权限范围</legend><label><input name="scope" type="checkbox" value="quote-only" checked>行情、基础资料与行情榜单</label><label><input name="scope" type="checkbox" value="history">历史、采样、公司行动与交易日历</label><label><input name="scope" type="checkbox" value="macro">资讯与宏观缓存</label></fieldset><button>创建密钥</button></form>
<section id="secret-area" hidden aria-labelledby="secret-heading"><h2 id="secret-heading">请保存新密钥</h2><p>仅在本次操作后显示。服务端只持久化摘要；关闭、锁定或刷新后无法再次读取明文。</p><label for="secret">新只读密钥</label><input id="secret" type="password" readonly autocomplete="off"><button id="reveal" type="button">显示／隐藏</button><button id="copy" type="button">复制密钥</button></section>
<h2>已有密钥</h2><p>轮换立即启用新密钥，旧密钥有24小时宽限期；二者共用配额。撤销会使同一轮换系列全部失效。</p><div class="table-wrap"><table><thead><tr><th scope="col">名称</th><th scope="col">权限</th><th scope="col">状态</th><th scope="col">到期时间</th><th scope="col">操作</th></tr></thead><tbody id="keys"></tbody></table></div></section></main></body></html>
