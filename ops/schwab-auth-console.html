<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>嘉信服务器授权</title>
<style>body{margin:0;background:#f3f5f8;color:#182639;font:15px system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:18px}header{display:flex;align-items:center;gap:20px;justify-content:space-between}h1{font-size:23px;margin:0 0 7px}p{margin:6px 0;line-height:1.6}.note{color:#536478}#state{padding:12px 16px;background:#e6eefb;border-radius:8px;margin-bottom:12px}#screen{display:block;width:100%;min-height:180px;background:#fff;border:1px solid #ccd4df;border-radius:8px;outline:0}#screen:focus{box-shadow:0 0 0 3px #6a9bf4}button{padding:9px 16px;border:1px solid #ccd4df;background:white;border-radius:6px;cursor:pointer}#done{padding:32px;background:#e5f5eb;border-radius:8px;font-size:19px}footer{font-size:13px;color:#536478;padding:12px 0}</style>
<header><div><h1>嘉信服务器授权</h1><p class="note">在下方嘉信页面中登录，并在提示时将此设备设为受信任。账号密码由你直接输入，工具不保存登录密码。</p></div><button id="cancel">结束本次登录</button></header>
<main><div id="state">正在连接服务器浏览器…</div><div id="done" hidden>授权成功，服务器已保存新凭证。现在可以关闭此页面。</div><img id="screen" tabindex="0" alt="嘉信登录页面"><footer>点击页面后可直接输入；支持 Tab、Enter、方向键、滚轮和粘贴。此窗口显示的是服务器上的专用浏览器。</footer></main>
<script nonce="__NONCE__">
const screen=document.querySelector('#screen'),message=document.querySelector('#state'),headers={'X-QQQSP-Local-Auth':'1'};let finished=false,blobUrl,queue=Promise.resolve();
function action(body){queue=queue.then(async()=>{const r=await fetch('/action',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error();}).catch(()=>{message.textContent='连接暂时中断，请稍候。';});}
screen.addEventListener('click',e=>{screen.focus();const r=screen.getBoundingClientRect();action({type:'click',x:(e.clientX-r.left)*1200/r.width,y:(e.clientY-r.top)*900/r.height});});
screen.addEventListener('wheel',e=>{e.preventDefault();action({type:'wheel',deltaY:e.deltaY});},{passive:false});
screen.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v')return;e.preventDefault();if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey)action({type:'text',text:e.key});else if(['Enter','Tab','Backspace','Delete','Escape','ArrowLeft','ArrowUp','ArrowRight','ArrowDown','Home','End','PageUp','PageDown','a','A'].includes(e.key))action({type:'key',key:e.key.toLowerCase()==='a'?'a':e.key,modifiers:(e.altKey?1:0)|(e.ctrlKey?2:0)|(e.metaKey?4:0)|(e.shiftKey?8:0)});});
screen.addEventListener('paste',e=>{e.preventDefault();action({type:'text',text:e.clipboardData.getData('text')});});
document.querySelector('#cancel').onclick=()=>action({type:'cancel'});
const labels={WAITING:'请在下方页面登录嘉信。',LOGIN:'请登录嘉信；密码不会由本工具保存。',MFA:'请完成嘉信要求的二次验证。',CONSENT:'请核对并完成嘉信授权。',TRUST_DEVICE:'请按嘉信提示选择是否信任此服务器设备。',EXCHANGING:'正在保存授权凭证…',READY:'授权成功。',FAILED:'本次授权未完成，现有行情服务继续运行。'};
async function update(){if(finished)return;try{const r=await fetch('/status',{headers}),s=await r.json();message.textContent=labels[s.status]||'请继续完成嘉信页面上的操作。';if(s.status==='READY'){finished=true;screen.hidden=true;document.querySelector('#done').hidden=false;document.querySelector('#cancel').hidden=true;return;}if(s.status==='FAILED'){finished=true;return;}const f=await fetch('/frame',{headers});if(f.ok){const next=URL.createObjectURL(await f.blob());screen.src=next;if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=next;}}catch{message.textContent='正在等待连接恢复…';}setTimeout(update,650);}update();
</script></html>
